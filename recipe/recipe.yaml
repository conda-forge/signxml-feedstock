schema_version: 1

context:
  name: signxml
  version: "5.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 1a7f19fad67941ad2aae9b0daf5a53b29248308fc4911c40f7242770221a707d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vvv --no-deps

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
  run:
    - certifi >=2023.11.17
    - cryptography >=45
    - lxml >=5.2.1,<7
    - python >=${{ python_min }}
tests:
  - python:
      imports:
        - signxml
        - signxml.util
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Python XML Signature library
  homepage: https://xml-security.github.io/signxml/
  repository: https://github.com/XML-Security/signxml
  documentation: https://xml-security.github.io/signxml/

extra:
  recipe-maintainers:
    - fhoehle
